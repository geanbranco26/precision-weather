name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package.json

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Gerar APK
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-result.json

      - name: Obter URL do APK
        working-directory: app
        id: apk-info
        run: |
          APK_URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build-result.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build?.artifacts?.buildUrl;
            if (!url) {
              console.error('URL do APK não encontrada.');
              console.error(JSON.stringify(build, null, 2));
              process.exit(1);
            }
            console.log(url);
          ")

          echo "APK_URL=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Baixar APK
        working-directory: app
        run: |
          mkdir -p artifacts

          curl -L \
            "${{ steps.apk-info.outputs.APK_URL }}" \
            -o artifacts/precision-weather.apk

          ls -lh artifacts/precision-weather.apk

      - name: Verificar APK
        working-directory: app
        run: |
          test -s artifacts/precision-weather.apk
          file artifacts/precision-weather.apk

      - name: Enviar APK para os artefatos do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Precision-Weather-APK
          path: app/artifacts/precision-weather.apk
          if-no-files-found: error
          retention-days: 30          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-result.json

      - name: Obter ID do build
        working-directory: app
        id: build-info
        run: |
          BUILD_ID=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('build-result.json','utf8')); console.log(Array.isArray(d) ? d[0].id : d.id)")
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: Baixar APK gerado
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          eas build:download \
            --build-id "${{ steps.build-info.outputs.BUILD_ID }}" \
            --non-interactive \
            --output artifacts/app.apk

      - name: Verificar APK
        working-directory: app
        run: |
          test -f artifacts/app.apk
          ls -lh artifacts/app.apk
          file artifacts/app.apk

      - name: Enviar APK para os artefatos do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: precision-weather-apk
          path: app/artifacts/app.apk
          if-no-files-found: error

      - name: Mostrar informações do build
        if: always()
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list \
            --platform android \
            --limit 1 \
            --non-interactive
