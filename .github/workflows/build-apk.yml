name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Gerar APK
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Baixar APK gerado
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts

          eas build:download \
            --platform android \
            --non-interactive

          APK=$(find . -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum arquivo APK foi encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          cp "$APK" artifacts/precision-weather.apk

      - name: Verificar APK
        working-directory: app
        run: |
          ls -lh artifacts/precision-weather.apk
          file artifacts/precision-weather.apk

      - name: Enviar APK para os artefatos do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Precision-Weather-APK
          path: app/artifacts/precision-weather.apk
          if-no-files-found: error
          retention-days: 30
