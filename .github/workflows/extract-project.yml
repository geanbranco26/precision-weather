name: Extrair projeto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p extracted
          unzip -q precision-weather.zip -d extracted

          if [ -d "extracted/precision-weather" ]; then
            cp -a extracted/precision-weather/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f precision-weather.zip

      - name: Salvar projeto no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "Extrair projeto Precision Weather"
            git push
          fi
